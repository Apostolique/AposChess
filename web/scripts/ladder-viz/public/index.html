<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AposChess · Ladder</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%99%9E%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="dot"></span> AposChess <small>ladder</small></div>
    <nav class="tabs" id="tabs">
      <button data-view="ladder" class="active">Ladder</button>
      <button data-view="generations">Generations</button>
      <button data-view="depth">Depth × Elo</button>
      <button data-view="matchups">Matchups</button>
      <button data-view="expected">Expected</button>
      <button data-view="games">Games</button>
      <button data-view="training">Training</button>
    </nav>
    <div class="spacer"></div>
    <div class="live-pill" id="livePill"><span class="beat"></span><span id="liveText">connecting…</span></div>
    <button class="icon-btn" id="soundBtn" title="Mute / unmute move sounds">🔊</button>
    <button class="icon-btn" id="themeBtn" title="Toggle light / dark">◐</button>
  </header>

  <main>
    <section class="view active" id="view-ladder"></section>
    <section class="view" id="view-generations"></section>
    <section class="view" id="view-depth"></section>
    <section class="view" id="view-matchups"></section>
    <section class="view" id="view-expected"></section>
    <section class="view" id="view-games"></section>
    <section class="view" id="view-training"></section>
  </main>

  <div class="tooltip" id="tooltip"></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
